<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles for iOS / PWA -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Glowing Pulse & Dumbbell Icon -->
  <g transform="translate(256,256) scale(1.15) translate(-256,-256)" filter="url(#glow)">
    <!-- Dumbbell Bar -->
    <rect x="180" y="244" width="152" height="24" rx="12" fill="#e2e8f0"/>
    
    <!-- Left Weight Plates -->
    <rect x="156" y="180" width="28" height="152" rx="14" fill="url(#primaryGrad)"/>
    <rect x="126" y="204" width="22" height="104" rx="11" fill="url(#accentGrad)"/>
    <rect x="106" y="224" width="14" height="64" rx="7" fill="#10b981"/>

    <!-- Right Weight Plates -->
    <rect x="328" y="180" width="28" height="152" rx="14" fill="url(#primaryGrad)"/>
    <rect x="364" y="204" width="22" height="104" rx="11" fill="url(#accentGrad)"/>
    <rect x="392" y="224" width="14" height="64" rx="7" fill="#10b981"/>

    <!-- Energy Pulse / Heartbeat Line -->
    <path d="M 120 370 L 200 370 L 225 315 L 260 410 L 295 345 L 315 370 L 392 370" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
